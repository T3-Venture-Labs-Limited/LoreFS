name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Vet and unit tests
        run: |
          go vet ./...
          go test -race ./...
      - name: Static analysis
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Privacy check (secrets and addresses)
        run: |
          scripts/check-private-test.sh
          scripts/check-private.sh
      - name: Shell scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning scripts/*.sh install.sh

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: FUSE and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 jq
          echo user_allow_other | sudo tee -a /etc/fuse.conf
      - name: Build
        run: make build
      - name: Integration rig (Redis)
        run: scripts/itest.sh --fast
      - name: Integration rig (Valkey)
        run: INDEX_IMAGE=valkey/valkey:8-alpine scripts/itest.sh --fast
      - name: Creating drives
        run: scripts/create-test.sh
      - name: Version recording
        run: scripts/recorder-test.sh
      - name: Backup and restore
        run: scripts/backup-test.sh
      - name: File-manager entry logic
        run: python3 scripts/nautilus-extension-test.py
